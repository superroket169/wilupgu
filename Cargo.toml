[package]
name = "wilupgu"
version = "0.4.3"
edition = "2021"
description = "Backend-independent GPU compute for Rust, built on an ownership-based backend contract. Aimed at low-end hardware; no autograd, no shape system."
license = "MIT OR Apache-2.0"
repository = "https://github.com/superroket169/wilupgu"
readme = "docs/README.md"
keywords = ["gpu", "wgpu", "cuda", "tensor", "compute"]
categories = ["science", "hardware-support"]
include = ["src/**", "Cargo.toml", "licenses/*", "docs/README.md"]

[dependencies]
wgpu = { version = "30", optional = true }
bytemuck = { version = "1.15", features = ["derive", "extern_crate_alloc"] }
pollster = { version = "0.3", optional = true }
futures-intrusive = { version = "0.5", optional = true }
# parses WGSL in the shader standards tests
naga = { version = "30", optional = true, features = ["wgsl-in"] }
half = { version = "2", features = ["bytemuck"] }

[features]
default = ["tool-builtins"]
tool-builtins = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:futures-intrusive", "dep:naga"]
cpu = []

[package.metadata.docs.rs]
features = ["cpu"]
