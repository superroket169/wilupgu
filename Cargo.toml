[package]
name = "wilupgu"
version = "0.7.0"
edition = "2021"
description = "Borrow-checked GPU dispatch for Rust, with optional tools on top."
license = "MIT OR Apache-2.0"
repository = "https://github.com/superroket169/wilupgu"
readme = "docs/README.md"
keywords = ["gpu", "shader", "backend", "tensor", "compute"]
categories = ["science", "hardware-support"]
include = ["src/**", "Cargo.toml", "licenses/*", "docs/README.md"]

[dependencies]
wgpu = { version = "30", optional = true, features = ["glsl", "spirv"] }
bytemuck = { version = "1.15", features = ["derive", "extern_crate_alloc"] }
pollster = { version = "0.3", optional = true }
# parses WGSL in the shader standards tests
naga = { version = "30", optional = true, features = ["wgsl-in"] }
half = { version = "2", features = ["bytemuck"] }
# The CUDA version is the user's to pick: CUDARC_CUDA_VERSION, or a cuda-XXXXX
# feature on cudarc in their own Cargo.toml.
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "nvrtc", "fallback-dynamic-loading"] }

[features]
default = ["tool-builtins"]
tool-builtins = []
tool-plan = []
tool-parity = []
tool-compile = []
compile-nvrtc = ["tool-compile", "dep:cudarc"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:naga"]
cpu = []
cuda = ["dep:cudarc", "cudarc/driver"]

[package.metadata.docs.rs]
features = ["cpu", "cuda", "wgpu", "tool-plan", "tool-parity", "compile-nvrtc", "cudarc/cuda-13030"]

[[example]]
name = "add"
required-features = ["cpu"]

[[example]]
name = "plan"
required-features = ["cpu", "tool-plan"]

[[example]]
name = "parity"
required-features = ["cpu", "tool-parity"]
