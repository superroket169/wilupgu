[package]
name = "wilupgu"
version = "0.4.2"
edition = "2021"
description = "Backend-independent tensor/dispatch library for Rust: GPU math on low-end hardware (wgpu / CUDA / CPU) with no autograd and no shape system."
license = "MIT OR Apache-2.0"
repository = "https://github.com/superroket169/wilupgu"
readme = "README.md"
keywords = ["gpu", "wgpu", "cuda", "tensor", "compute"]
categories = ["science", "hardware-support"]
include = ["src/**", "Cargo.toml", "LICENSE-*", "README.md"]

[dependencies]
wgpu = "30"
bytemuck = { version = "1.15", features = ["derive", "extern_crate_alloc"] }
pollster = "0.3"
futures-intrusive = "0.5"
cudarc = { version = "0.19", optional = true, features = ["cublas", "nvrtc", "cuda-version-from-build-system", "f16"] }
half = { version = "2", features = ["bytemuck"] }
rayon = { version = "1", optional = true }

[features]
default = []
vulkan = []
cuda = ["cudarc"]
cpu = []
rayon = ["dep:rayon"]
vulkano = []
